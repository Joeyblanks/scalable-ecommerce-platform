name: CI

# Builds and tests only the services a change touches. Each top-level folder that has both a
# pom.xml and a Dockerfile is a service (see docs/decisions/001 and 005).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # manual run: builds every service

# Least privilege: CI only needs to read the repository. No secrets are used anywhere.
permissions:
  contents: read

# A new push to a PR cancels the superseded run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so we can diff against the base commit
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/detect-services.sh

  test:
    name: Test (${{ matrix.service }})
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest # has Docker, which the Testcontainers integration tests need
    timeout-minutes: 20
    strategy:
      fail-fast: false # one failing service must not hide the result of the others
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Maven dependencies and wrapper distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ matrix.service }}-${{ hashFiles(format('{0}/pom.xml', matrix.service), format('{0}/.mvn/wrapper/maven-wrapper.properties', matrix.service)) }}
          restore-keys: |
            maven-${{ matrix.service }}-
      # Unit tests (Surefire) then Testcontainers integration tests (Failsafe) against real PostgreSQL.
      - name: ./mvnw verify
        run: ./mvnw -B -ntp verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports
            ${{ matrix.service }}/target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image (${{ matrix.service }})
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Build only, nothing is pushed to a registry. The build context is the service's own folder.
      - name: Build image
        run: docker build --pull --tag "local/${{ matrix.service }}:ci" "${{ matrix.service }}"
      - name: Check the image contains the application jar
        run: docker run --rm --entrypoint sh "local/${{ matrix.service }}:ci" -c 'ls -l /app/app.jar'

  # Single stable check to require in branch protection: it passes when every job that ran
  # passed (or was legitimately skipped because no service changed) and fails otherwise.
  ci-ok:
    name: CI result
    if: always()
    needs: [detect, test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "CI failed"; exit 1 ;;
          esac
