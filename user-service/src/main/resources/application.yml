spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/userdb}
    username: ${DB_USERNAME:user_service}
    password: ${DB_PASSWORD:user_service}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches

app:
  jwt:
    # RS256 signing key (PKCS#8 PEM). Never committed: set exactly one of these two.
    private-key: ${JWT_PRIVATE_KEY:}             # base64-encoded (or raw) PEM text
    private-key-file: ${JWT_PRIVATE_KEY_FILE:}   # path to a mounted PEM file
    issuer: ${JWT_ISSUER:user-service}
    expiration: PT1H
  bootstrap-admin:
    # Optional first admin, created at startup only. No default: both must be set together.
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  service-tokens:
    # OAuth2 client_credentials tokens for service-to-service calls. See README "Service tokens".
    ttl: PT5M
    clients:
      # Enabled only when its bcrypt secret hash is provided. Never put the plain secret here.
      - client-id: order-service
        secret-hash: ${ORDER_SERVICE_CLIENT_SECRET_HASH:}
        scopes: [stock:reserve]
        audience: product-catalog-service
      # Reads a user's contact details (email) to send notifications. Nothing else.
      - client-id: notification-service
        secret-hash: ${NOTIFICATION_SERVICE_CLIENT_SECRET_HASH:}
        scopes: [users:read-contact]
        audience: user-service

  rate-limits:
    # Limits only user-service can enforce (ADR 011). In memory, per instance. Per-IP limits on login and
    # register are in the gateway.
    max-tracked-keys: 10000
    login:
      max-failures: 10        # failed logins per account (normalized email) ...
      window: PT15M           # ... within this window block that account's logins until the oldest expires
    token:
      max-failures-per-address: 10   # failed token requests per caller address ...
      failure-window: PT1M
      max-per-client: 30             # successful token requests per client id (tokens live 5 min and are cached)
      client-window: PT1M

management:
  endpoints:
    web:
      exposure:
        include: health
