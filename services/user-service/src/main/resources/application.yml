spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/userdb}
    username: ${DB_USERNAME:user_service}
    password: ${DB_PASSWORD:user_service}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches

app:
  jwt:
    # Must be at least 32 characters (HS256). No default on purpose: set JWT_SECRET.
    secret: ${JWT_SECRET}
    expiration: PT1H

management:
  endpoints:
    web:
      exposure:
        include: health
