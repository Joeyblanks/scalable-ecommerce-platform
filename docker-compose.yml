services:
  user-db:
    image: postgres:17
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: ${USER_DB_USERNAME:-user_service}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-user_service}
    ports:
      - "5432:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d userdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build:
      context: ./user-service
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://user-db:5432/userdb
      DB_USERNAME: ${USER_DB_USERNAME:-user_service}
      DB_PASSWORD: ${USER_DB_PASSWORD:-user_service}
      # RS256 signing key: never committed, must stay the same across restarts. See README.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Set JWT_PRIVATE_KEY in .env - see README "Signing key"}
      # Optional first admin, created at startup only (both or neither). No defaults.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # bcrypt hash of order-service's client secret; unset = that client is disabled.
      ORDER_SERVICE_CLIENT_SECRET_HASH: ${ORDER_SERVICE_CLIENT_SECRET_HASH:-}
    ports:
      - "8080:8080"

  catalog-db:
    image: postgres:17
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: ${CATALOG_DB_USERNAME:-catalog_service}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_service}
    ports:
      # Host port is configurable because 5433 is a common alternative Postgres port.
      - "${CATALOG_DB_PORT:-5434}:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d catalogdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  product-catalog-service:
    build:
      context: ./product-catalog-service
    # Deliberately no dependency on user-service: it only needs the JWKS URL, and fetches the
    # keys lazily on the first authenticated request.
    depends_on:
      catalog-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://catalog-db:5432/catalogdb
      DB_USERNAME: ${CATALOG_DB_USERNAME:-catalog_service}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_service}
      JWT_JWK_SET_URI: http://user-service:8080/.well-known/jwks.json
      JWT_ISSUER: user-service
    ports:
      - "8081:8081"

  # Redis is internal to the compose network on purpose: no host port, so nothing unauthenticated is
  # exposed on your machine and nothing can clash with other local containers.
  # Inspect it with: docker compose exec cart-redis redis-cli
  cart-redis:
    image: redis:8-alpine
    # Append-only file + volume so carts survive a restart in dev. Losing carts would be tolerable.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cart-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  cart-service:
    build:
      context: ./cart-service
    # Needs only Redis to start. The catalog and the JWKS (user-service) are called lazily.
    depends_on:
      cart-redis:
        condition: service_healthy
    environment:
      REDIS_HOST: cart-redis
      CATALOG_BASE_URL: http://product-catalog-service:8081
      # Consumes OrderPlaced to remove ordered items. Deliberately no depends_on: the cart API works
      # without the broker, and the listener connects (and catches up) whenever RabbitMQ is up.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-ecommerce}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ecommerce}
      JWT_JWK_SET_URI: http://user-service:8080/.well-known/jwks.json
      JWT_ISSUER: user-service
    ports:
      - "8082:8082"

  # Domain events (ADR 002, 007). AMQP stays internal; only the management UI is published.
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-ecommerce}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ecommerce}
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-db:
    image: postgres:17
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: ${ORDER_DB_USERNAME:-order_service}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_service}
    ports:
      - "${ORDER_DB_PORT:-5435}:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d orderdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-service:
    build:
      context: ./order-service
    # Needs its database and the broker to start. user-service, cart and catalog are called lazily;
    # if they are down, placing an order fails cleanly (503) and nothing is left half-done.
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/orderdb
      DB_USERNAME: ${ORDER_DB_USERNAME:-order_service}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-order_service}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-ecommerce}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ecommerce}
      JWT_JWK_SET_URI: http://user-service:8080/.well-known/jwks.json
      JWT_ISSUER: user-service
      SERVICE_TOKEN_URI: http://user-service:8080/oauth2/token
      # Plain client secret (user-service only holds its bcrypt hash). See README "Service tokens".
      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET:-}
      CART_BASE_URL: http://cart-service:8082
      CATALOG_BASE_URL: http://product-catalog-service:8081
    ports:
      - "8083:8083"

  payment-db:
    image: postgres:17
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: ${PAYMENT_DB_USERNAME:-payment_service}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_service}
    ports:
      - "${PAYMENT_DB_PORT:-5436}:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d paymentdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-service:
    build:
      context: ./payment-service
    # Needs its database and the broker to start. It only verifies customer tokens (JWKS from
    # user-service, fetched lazily) and never calls another service: it works from events alone.
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://payment-db:5432/paymentdb
      DB_USERNAME: ${PAYMENT_DB_USERNAME:-payment_service}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_service}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-ecommerce}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ecommerce}
      JWT_JWK_SET_URI: http://user-service:8080/.well-known/jwks.json
      JWT_ISSUER: user-service
    ports:
      - "8084:8084"

volumes:
  user-db-data:
  catalog-db-data:
  cart-redis-data:
  rabbitmq-data:
  order-db-data:
  payment-db-data:
